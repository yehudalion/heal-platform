<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>עד הפטור — הכנה למבחן האנגלית: אמירנט והלאל</title>
    <meta name="description" content="פלטפורמת הכנה למבחן הלאל — מבחן האנגלית הנפרד. אוצר מילים, ניסוח מחדש והאזנה, עם הסברים בעברית על כל שאלה." />
    <meta name="theme-color" content="#1F5C43" />
    <meta name="google-site-verification" content="8Uwy4q1WTw1_-q9o_Yb_HKKVSp9yISd57eZceQRuuGM" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- PWA (סשן שבת 5): manifest + אייקון לאפל; ה-service worker נרשם ב-src/lib/pwa.js -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="עד הפטור" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="עד הפטור" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:title" content="עד הפטור — הכנה למבחן האנגלית: אמירנט והלאל" />
    <meta property="og:description" content="אוצר מילים, ניסוח מחדש והאזנה — עם הסברים בעברית על כל שאלה. ללא פרסומות." />
    <!-- SEO 2026-09-01: og:image היה נתיב יחסי, ופייסבוק/וואטסאפ דורשים
         כתובת מלאה — בלעדיה כרטיס השיתוף יוצא בלי תמונה. נוספו גם
         og:url ו-canonical, שהיו חסרים לגמרי בדף הבית (בשמונת עמודי
         ה-SEO הם קיימים מלכתחילה). -->
    <meta property="og:image" content="https://highscore-eight.vercel.app/opengraph.jpg" />
    <meta property="og:url" content="https://highscore-eight.vercel.app/" />
    <link rel="canonical" href="https://highscore-eight.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap"
      rel="stylesheet"
    />

    <!--
      Critical first-paint styles only (AUDIT: "הבהוב פריסה במסך הכניסה
      בטעינה איטית"). Everything here is a no-op once styles.css applies —
      the same values it already sets — it just prevents a white flash and a
      zero-height #app in the gap before the bundle runs. Do NOT grow this
      block into a second stylesheet: layout stays in styles.css.
    -->
    <style>
      html, body { margin: 0; background: #F5F1E8; color: #14201A; }
      #app { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
